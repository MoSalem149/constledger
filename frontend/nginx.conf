server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── API reverse-proxy ───────────────────────────────────────────────
    # proxy_pass WITHOUT a trailing slash: nginx appends the full matched URI,
    # so POST /api/auth/login → POST /api/auth/login on the upstream.
    # Never add a trailing slash to proxy_pass here — it strips the location
    # prefix and causes 405s (POST /api/auth/login becomes POST /login).

    # Core backend — auth, users, finance, reports
    location /api/auth {
        proxy_pass         ${CORE_BACKEND_URL};
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/users {
        proxy_pass         ${CORE_BACKEND_URL};
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/finance {
        proxy_pass         ${CORE_BACKEND_URL};
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/reports {
        proxy_pass         ${CORE_BACKEND_URL};
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # AI backend — contracts, uploads
    location /api/contracts {
        proxy_pass         ${AI_BACKEND_URL};
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/uploads {
        proxy_pass         ${AI_BACKEND_URL};
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── SPA fallback ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}