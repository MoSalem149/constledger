services:

  # ── MongoDB ─────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: cpms-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - cpms-net

  # ── Core Backend (Node/Express JS) ──────────────────────────────────
  # Handles authentication & user management only.
  # Issues JWTs; never exposes business APIs directly.
  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: cpms-backend-core
    restart: unless-stopped
    env_file: ./backend-core/.env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/cpms
      PORT: "3000"
      # JWT_SECRET, JWT_EXPIRES_IN, FRONTEND_URL — set in backend-core/.env
    ports:
      - '3000:3000'
    depends_on:
      - mongo
    networks:
      - cpms-net
    volumes:
      # hot-reload in dev — remove for production image
      - ./backend-core/src:/app/src:ro

  # ── AI Backend (Node/Express TS) ─────────────────────────────────────
  # Owns all SRS business APIs: contracts, finance, performance, reports.
  # Verifies JWTs issued by backend-core; never issues them.
  # Uses AWS S3 for contract file storage and OpenAI for AI analysis.
  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: cpms-backend-ai
    restart: unless-stopped
    env_file: ./backend-ai/.env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/cpms
      PORT: "5000"
      # The following must match their counterparts in backend-core/.env:
      #   JWT_SECRET        — shared for token verification
      #   AI_SERVICE_SECRET — shared for internal backend-core → backend-ai calls
      # All other secrets (OPENAI_API_KEY, AWS_*, S3_*, FRONTEND_URL)
      # are loaded from backend-ai/.env via env_file above.
    ports:
      - '5000:5000'
    depends_on:
      - mongo
      - backend-core
    networks:
      - cpms-net

  # ── Frontend (React + Vite) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpms-frontend
    restart: unless-stopped
    environment:
      # Base URLs without trailing /api — the frontend services append paths themselves.
      VITE_API_URL: http://localhost:3000
      VITE_AI_API_URL: http://localhost:5000
    ports:
      - '5173:5173'
    depends_on:
      - backend-core
      - backend-ai
    networks:
      - cpms-net

volumes:
  mongo_data:

networks:
  cpms-net:
    driver: bridge