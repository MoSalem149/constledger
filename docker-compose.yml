# docker-compose.yml — CPMS root
name: cpms

services:

  # ───────────────────────────────────────────────────────────────────────────
  # mongodb  (MongoDB database)
  # ───────────────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: cpms-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
    networks:
      - cpms-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    ports:
      - "27017:27017"

  # ───────────────────────────────────────────────────────────────────────────
  # backend-core  (Node / Express — auth, users, finance, reports)
  # ───────────────────────────────────────────────────────────────────────────
  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: cpms-core
    restart: unless-stopped
    env_file: ./backend-core/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cpms-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    ports:
      - "3000:3000"

  # ───────────────────────────────────────────────────────────────────────────
  # backend-ai  (Node / TypeScript — contracts, uploads, AI analysis)
  # ───────────────────────────────────────────────────────────────────────────
  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: cpms-ai
    restart: unless-stopped
    env_file: ./backend-ai/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cpms-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "5000:5000"

  # ───────────────────────────────────────────────────────────────────────────
  # frontend  (React / Vite — served by nginx, api proxied to backends)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpms-frontend
    restart: unless-stopped
    environment:
      CORE_BACKEND_URL: http://backend-core:3000
      AI_BACKEND_URL: http://backend-ai:5000
    ports:
      - "5173:80"
    depends_on:
      backend-core:
        condition: service_healthy
      backend-ai:
        condition: service_healthy
    networks:
      - cpms-net

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  cpms-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mongodb_data: