name: constledger

services:

  # ── MongoDB ─────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: cpms-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'           # MongoDB default
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cpms-net

  # ── Core Backend (Node/Express JS) ──────────────────────────────────
  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: cpms-backend-core
    restart: unless-stopped
    env_file: ./backend-core/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb+srv://mohamedsalemdevofficial_db_user:6eDqJY4jY520illL@cpms-db.ko9ddow.mongodb.net/cpms
      FRONTEND_URL: http://localhost:5173
      AI_SERVICE_URL: http://backend-ai:5000
    ports:
      - '3000:3000'             # Express default
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - cpms-net
  # ── AI Backend (Node/Express TS) ─────────────────────────────────────
  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: cpms-backend-ai
    restart: unless-stopped
    env_file: ./backend-ai/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb+srv://mohamedsalemdevofficial_db_user:6eDqJY4jY520illL@cpms-db.ko9ddow.mongodb.net/cpms
      FRONTEND_URL: http://localhost:5173
      CORE_SERVICE_URL: http://backend-core:3000
    ports:
      - '5000:5000'             # AI service default
    depends_on:
      mongo:
        condition: service_healthy
      backend-core:
        condition: service_healthy
    networks:
      - cpms-net

  # ── Frontend (React + Vite) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpms-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:3000/api
      - VITE_AI_API_URL=http://localhost:5000/api
    ports:
      - '5173:5173'             # Vite default
    depends_on:
      - backend-core
      - backend-ai
    networks:
      - cpms-net

volumes:
  mongo_data:

networks:
  cpms-net:
    driver: bridge
